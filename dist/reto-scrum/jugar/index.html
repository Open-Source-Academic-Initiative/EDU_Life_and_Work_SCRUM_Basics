<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Scrum más Master del Restrepo · Reto Scrum</title>
<link rel="stylesheet" href="css/game.css?v=1c526ab7af">
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <div class="chap"><b id="hud-chapter"></b><span id="hud-topic"></span></div>
    <div class="meters">
      <div class="meter" data-k="caja" role="img"><span class="ico" aria-hidden="true">💰</span><span class="lbl">Caja</span><span class="bar"><i></i></span><b class="val">0</b></div>
      <div class="meter" data-k="cliente" role="img"><span class="ico" aria-hidden="true">🤝</span><span class="lbl">Cliente</span><span class="bar"><i></i></span><b class="val">0</b></div>
      <div class="meter" data-k="equipo" role="img"><span class="ico" aria-hidden="true">💪</span><span class="lbl">Equipo</span><span class="bar"><i></i></span><b class="val">0</b></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="screen" width="320" height="176" role="img" aria-label="Escenario del juego en pixel art: el barrio Restrepo de Bogotá"></canvas>
  </div>

  <section id="panel" hidden>
    <div id="dlg" class="dlg" hidden aria-live="polite">
      <canvas id="portrait" width="16" height="16" aria-hidden="true"></canvas>
      <div class="dlg-body">
        <div id="dlg-who" class="who"></div>
        <p id="dlg-text" class="say"></p>
        <div id="dlg-choices" class="choices" tabindex="-1" aria-label="Elige una opción con el número, las flechas o haciendo clic"></div>
        <button id="dlg-next" class="btn next" type="button">Continuar ▸</button>
      </div>
    </div>
    <div id="help" class="help">
      <p id="mission"></p>
      <button id="btn-mission" class="btn" type="button">🎯 Ir a la misión</button>
      <p class="small">Camina con las flechas/WASD o tocando el piso · Habla con Espacio/Enter o tocando a la persona</p>
    </div>
  </section>

  <div id="overlay" class="overlay" hidden></div>
</div>
<script src="js/scorm.js?v=063b5e50c0"></script>
<script src="js/story-data.js?v=cbf00c018d"></script>
<script src="js/pixel.js?v=67a8d79748"></script>
<script src="js/cards.js?v=a63374f8f9"></script>
<script src="js/game.js?v=b94c6f265d"></script>
</body>
</html>
