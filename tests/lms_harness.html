<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCORM 1.2 test harness</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; height: 100vh; background: #fff; color: #111; }
  header { padding: 8px 12px; background: #1f2937; color: #fff; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header button { font: inherit; padding: 4px 10px; }
  #state { font-family: ui-monospace, monospace; font-size: 12px; }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!--
  Development-only mock LMS (not shipped in the SCORM zip).
  Serve the repository root (python3 -m http.server) and open
  /tests/lms_harness.html. The course runs in an iframe and talks to the
  SCORM 1.2 API below, like it would inside Moodle. The CMI data model is
  persisted in localStorage so "Reload course" tests suspend/resume.
-->
<header>
  <strong>Mock LMS · SCORM 1.2</strong>
  <button id="reload" type="button">Reload course</button>
  <button id="wipe" type="button">Wipe LMS data</button>
  <span id="state"></span>
</header>
<iframe id="sco" src="../juego_scrum_restrepo/juego.html" title="Juego"></iframe>
<script>
  // ?db=name gives each test run its own isolated LMS record
  var KEY = "harness-cmi-" + ((/[?&]db=(\w+)/.exec(location.search) || [])[1] || "default");
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { saved = null; }
  var cmi = saved || {
    "cmi.core.student_name": "Tester, Ana",
    "cmi.core.lesson_status": "not attempted",
    
    "cmi.interactions._count": "0"
  };
  window.calls = [];
  var initialized = false;
  function persist() { localStorage.setItem(KEY, JSON.stringify(cmi)); show(); }
  function show() {
    document.getElementById("state").textContent =
      "status=" + cmi["cmi.core.lesson_status"] + " score=" + (cmi["cmi.core.score.raw"] || "-") +
      " location=" + (cmi["cmi.core.lesson_location"] || "-") + " interactions=" + cmi["cmi.interactions._count"];
  }
  window.API = {
    LMSInitialize: function () { calls.push(["LMSInitialize"]); initialized = true; cmi["cmi.core.entry"] = cmi["cmi.suspend_data"] ? "resume" : "ab-initio"; return "true"; },
    LMSFinish: function () { calls.push(["LMSFinish"]); initialized = false; persist(); return "true"; },
    LMSGetValue: function (k) { calls.push(["get", k]); return cmi[k] == null ? "" : cmi[k]; },
    LMSSetValue: function (k, v) {
      calls.push(["set", k, v]);
      if (!initialized) return "false";
      var m = /^cmi\.interactions\.(\d+)\./.exec(k);
      if (m) cmi["cmi.interactions._count"] = String(Math.max(+cmi["cmi.interactions._count"], +m[1] + 1));
      cmi[k] = String(v);
      return "true";
    },
    LMSCommit: function () { calls.push(["LMSCommit"]); persist(); return "true"; },
    LMSGetLastError: function () { return "0"; },
    LMSGetErrorString: function () { return ""; },
    LMSGetDiagnostic: function () { return ""; }
  };
  window.getCmi = function () { return cmi; };
  document.getElementById("reload").onclick = function () { document.getElementById("sco").contentWindow.location.reload(); };
  document.getElementById("wipe").onclick = function () { localStorage.removeItem(KEY); location.reload(); };
  show();
</script>
</body>
</html>
